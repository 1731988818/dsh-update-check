<svg xmlns="http://www.w3.org/2000/svg" width="352" height="136" viewBox="0 0 352 136" role="img" aria-label="The update card as it appears in the bottom-right corner: two plugin rows with an Update button, one market row marked manual, and a footer with the check and update-all links.">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="351" height="135" rx="12" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)" />

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="14" y="26.5" font-size="13" font-weight="600" fill="#111827">发现 2 项可用更新</text>
    <text x="338" y="27" font-size="16" fill="#6b7280" text-anchor="end">×</text>
  </g>

  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
    <text x="14" y="52.5" font-size="12" fill="#111827">dsh-pet</text>
    <text x="298" y="52.5" font-size="11" fill="#6b7280" text-anchor="end">0.3.7 → 0.3.8</text>

    <text x="14" y="72.5" font-size="12" fill="#111827">billion-context</text>
    <text x="298" y="72.5" font-size="11" fill="#6b7280" text-anchor="end">0.1.203 → 0.1.204</text>

    <text x="14" y="92.5" font-size="12" fill="#111827">dshmarket</text>
    <text x="298" y="92.5" font-size="11" fill="#6b7280" text-anchor="end">1.66.42 → 1.66.47</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect x="306" y="39" width="32" height="18" rx="6" fill="#f9fafb" stroke="#e5e7eb" />
    <text x="322" y="52" font-size="11" fill="#111827" text-anchor="middle">更新</text>

    <rect x="306" y="59" width="32" height="18" rx="6" fill="#f9fafb" stroke="#e5e7eb" />
    <text x="322" y="72" font-size="11" fill="#111827" text-anchor="middle">更新</text>

    <text x="338" y="92.5" font-size="11" fill="#d97706" text-anchor="end">需手动</text>
  </g>

  <line x1="14" y1="100" x2="338" y2="100" stroke="#f3f4f6" stroke-width="1" />

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#6b7280">
    <text x="14" y="118.5">可一键更新 2 个插件</text>
    <text x="338" y="118.5" fill="#247bbf" text-anchor="end">重新检查</text>
    <text x="284" y="118.5" fill="#247bbf" text-anchor="end">全部更新</text>
  </g>
</svg>
